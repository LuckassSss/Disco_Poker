# Сборка клиента на self-hosted раннере — маке с Unity 6000.5.5f1, Xcode и Android SDK.
#   пуш в main  → EditMode-тесты + APK (артефакт на сутки, для эмулятора)
#   тег vX.Y.Z  → тесты + AAB → Google Play (internal) и RuStore, iOS → TestFlight
# Площадка включается сама, когда в Settings → Secrets заведены её ключи (список — в CLAUDE.md).
name: client

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: client
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 180
    env:
      UNITY: /Applications/Unity/Hub/Editor/6000.5.5f1/Unity.app/Contents/MacOS/Unity
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
      HAS_RUSTORE: ${{ secrets.RUSTORE_KEY_ID != '' }}
      HAS_APPLE: ${{ secrets.ASC_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # без git clean -ffdx: Library переживает сборки, иначе каждый раз полный импорт ассетов
          clean: false

      - name: Версия и пакет
        run: |
          VERSION=""
          if [ "$RELEASE" = true ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          # номер сборки растёт с каждым запуском — Play/App Store/RuStore требуют рост versionCode
          echo "VERSION_ARGS=${VERSION:+-buildVersion $VERSION} -buildNumber $GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "PACKAGE=$(awk '/applicationIdentifier:/{f=1;next} f&&/Android:/{print $2;exit}' ProjectSettings/ProjectSettings.asset)" >> "$GITHUB_ENV"

      - name: EditMode-тесты
        run: |
          "$UNITY" -batchmode -nographics -projectPath "$PWD" -runTests -testPlatform EditMode \
            -testResults t.xml -logFile t.log || { tail -50 t.log; exit 1; }
          grep -o 'result="[A-Za-z]*"' t.xml | sort | uniq -c

      - name: Ключ подписи Android
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Android
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          if [ "$RELEASE" = true ]; then OUT=Builds/android/DiscoPoker.aab; FLAG=-aab; else OUT=Builds/android/DiscoPoker.apk; FLAG=; fi
          "$UNITY" -batchmode -nographics -projectPath "$PWD" -buildTarget Android \
            -executeMethod PokerClient.Editor.BuildTools.BuildAndroid -buildOutput "$OUT" $FLAG $VERSION_ARGS \
            -quit -logFile a.log || { grep -iE "error" a.log | tail -30; exit 1; }
          echo "ANDROID_OUT=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.run_number }}
          path: ${{ env.ANDROID_OUT }}
          # квота артефактов приватного репо мала: релизный AAB неделю (для первой ручной загрузки), APK сутки
          retention-days: ${{ env.RELEASE == 'true' && 7 || 1 }}
          compression-level: 0

      - name: Google Play (internal)
        if: env.RELEASE == 'true' && env.HAS_PLAY == 'true' && env.HAS_KEYSTORE == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE }}
          releaseFiles: ${{ env.ANDROID_OUT }}
          tracks: internal

      - name: RuStore
        if: env.RELEASE == 'true' && env.HAS_RUSTORE == 'true' && env.HAS_KEYSTORE == 'true'
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
        run: bash ci/rustore_upload.sh "$PACKAGE" "$ANDROID_OUT"

      - name: iOS → TestFlight
        if: env.RELEASE == 'true' && env.HAS_APPLE == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          # подпись автоматическая: xcodebuild сам заводит сертификат и профиль по ключу App Store Connect
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          "$UNITY" -batchmode -nographics -projectPath "$PWD" -buildTarget iOS \
            -executeMethod PokerClient.Editor.BuildTools.BuildIos $VERSION_ARGS \
            -quit -logFile i.log || { grep -iE "error" i.log | tail -30; exit 1; }
          xcodebuild -project Builds/ios/Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/DiscoPoker.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic "${AUTH[@]}" archive
          # destination=upload: экспорт сразу отправляет сборку в App Store Connect → TestFlight
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/DiscoPoker.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/ipa" "${AUTH[@]}"
